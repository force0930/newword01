<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣國小生字練習卷生成器（A4橫式）</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts 備援字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
  <!-- html2canvas & jsPDF 用於匯出高解析 PDF / PNG 與分享至 LINE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Hanzi Writer Data (用於真實動態筆順拆解渲染) -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

  <style>
    /* ==========================================
       全域變數與台灣標準字型設定
       ========================================== */
    :root {
      --border-main: #1e293b;
      --border-sub: #64748b;
      --grid-line: #94a3b8;
      --header-bg: #f1f5f9;
      --trace-color: #cbd5e1;
      --demo-color: #0f172a;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f3efe6;
      color: #1e293b;
    }

    .font-kai {
      font-family: "BiauKai", "DFKai-SB", "TW-Kai", "標楷體", "KaiTi", "STKaiti", "Noto Serif TC", serif;
    }

    .zhuyin-font {
      font-family: "BiauKai", "DFKai-SB", "標楷體", "Microsoft JhengHei", sans-serif;
    }

    /* ==========================================
       A4 橫式紙張結構 (297mm x 210mm)
       ========================================== */
    .a4-landscape-page {
      width: 297mm;
      height: 210mm;
      padding: 8mm 10mm;
      background: #ffffff;
      box-shadow: 0 12px 30px -8px rgba(15, 23, 42, 0.16), 0 4px 12px -4px rgba(15, 23, 42, 0.08);
      margin: 0 auto 24px auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      color: #0f172a;
    }

    /* 練習卷主表格 (由右至左排列：使用 flex-direction: row-reverse) */
    .worksheet-table {
      display: flex;
      flex-direction: row-reverse;
      flex: 1;
      border-top: 1.8px solid var(--border-main);
      border-right: 1.8px solid var(--border-main);
      box-sizing: border-box;
      width: 100%;
    }

    .ws-column {
      display: flex;
      flex-direction: column;
      border-left: 1.5px solid var(--border-main);
      border-bottom: 1.8px solid var(--border-main);
      box-sizing: border-box;
    }

    .ws-header-col {
      background-color: var(--header-bg);
      font-weight: 700;
      text-align: center;
      flex-shrink: 0;
    }

    .ws-cell {
      border-bottom: 1.2px solid var(--border-main);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .ws-cell:last-child {
      border-bottom: none;
    }

    /* 台灣標準右側直式注音框 */
    .zhuyin-strip {
      border-left: 1px dashed var(--border-sub);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .zhuyin-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .zhuyin-symbols {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.02;
    }

    .zhuyin-tone {
      position: absolute;
      right: 10%;
      top: 50%;
      transform: translateY(-50%);
      line-height: 1;
    }

    .zhuyin-neutral {
      line-height: 0.75;
      margin-bottom: 1px;
    }

    /* 田字格 SVG 背景 */
    .tian-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .char-glyph {
      position: relative;
      z-index: 2;
      line-height: 1;
      transform: translateY(-2%);
      user-select: none;
    }

    .glyph-demo {
      color: var(--demo-color);
    }

    .glyph-trace {
      color: var(--trace-color);
    }

    .glyph-outline {
      color: transparent;
      -webkit-text-stroke: 0.8px #94a3b8;
    }

    /* 筆順分解步驟格 */
    .stroke-order-box {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: flex-start;
      gap: 2px;
      padding: 2.5px;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .stroke-step-item {
      border: 0.5px solid #cbd5e1;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================
       A4 橫式列印樣式 (@media print)
       ========================================== */
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }

      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .no-print {
        display: none !important;
      }

      .app-layout {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
      }

      .preview-area {
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
      }

      .a4-landscape-page {
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        width: 297mm !important;
        height: 210mm !important;
        transform: none !important;
        page-break-after: always;
        break-after: page;
      }

      .a4-landscape-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 頂部功能導覽列 -->
  <header class="no-print bg-emerald-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-[1600px] mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-amber-400 text-emerald-950 font-bold flex items-center justify-center text-xl font-kai shadow">
          習
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-wide leading-tight">台灣國小生字練習卷生成器（A4橫式）</h1>
          <p class="text-[11px] text-emerald-200">由右至左直欄規格・自動部首筆畫筆順・文字匯入・LINE 一鍵分享</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <span id="pageBadge" class="text-xs bg-emerald-950/70 border border-emerald-700 px-3 py-1.5 rounded-full text-emerald-100">
          共 2 頁 A4 橫式
        </span>

        <!-- 匯入文字按鈕 -->
        <button onclick="openImportModal()" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs sm:text-sm font-medium px-3.5 py-2 rounded-xl border border-emerald-500/50 transition flex items-center gap-1.5 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          匯入文字 / 課文
        </button>

        <!-- 匯出 PDF -->
        <button onclick="exportToPDF()" id="btnExportPDF" class="bg-white hover:bg-stone-100 text-emerald-950 text-xs sm:text-sm font-bold px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          匯出 PDF
        </button>

        <!-- 分享至 LINE -->
        <button onclick="openLineShareModal()" class="bg-[#06C755] hover:bg-[#05b34c] text-white text-xs sm:text-sm font-bold px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5 cursor-pointer">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
          </svg>
          分享至 LINE
        </button>

        <!-- 直接列印 -->
        <button onclick="handlePrint()" class="bg-amber-400 hover:bg-amber-300 text-emerald-950 text-xs sm:text-sm font-bold px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          列印
        </button>
      </div>
    </div>
  </header>

  <!-- 主工作區 -->
  <div class="app-layout flex-1 max-w-[1600px] w-full mx-auto px-4 py-5 flex flex-col xl:flex-row gap-5 items-start">

    <!-- 左側控制面板 -->
    <aside class="no-print w-full xl:w-[390px] shrink-0 bg-white rounded-2xl shadow-sm border border-stone-200 p-4 space-y-4 xl:sticky xl:top-16 max-h-[calc(100vh-5rem)] overflow-y-auto">
      
      <!-- 1. 練習卷標題與版面設定 -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between">
          <label class="text-sm font-bold text-stone-800 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
            練習卷標題與規格
          </label>
          <button type="button" onclick="loadExamplePoem()" class="text-xs text-emerald-700 hover:underline font-medium cursor-pointer">
            載入《小時不識月》範例
          </button>
        </div>

        <input type="text" id="sheetTitleInput" value="國語生字練習卷《小時不識月》"
          class="w-full px-3 py-2 rounded-xl border border-stone-300 focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 outline-none text-sm font-bold text-stone-800">

        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <div>
            <label class="block text-xs text-stone-500 mb-1">每頁生字欄數</label>
            <select id="colsPerPageSelect" class="w-full px-2.5 py-1.5 rounded-xl border border-stone-300 text-xs font-medium bg-white outline-none focus:border-emerald-600">
              <option value="6">每頁 6 字 (寬格・低年級)</option>
              <option value="8" selected>每頁 8 字 (標準範例規格)</option>
              <option value="10">每頁 10 字 (緊湊・高年級)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-stone-500 mb-1">練習田字格數量</label>
            <select id="practiceRowsSelect" class="w-full px-2.5 py-1.5 rounded-xl border border-stone-300 text-xs font-medium bg-white outline-none focus:border-emerald-600">
              <option value="3">3 格練習</option>
              <option value="4" selected>4 格練習 (範例標準)</option>
              <option value="5">5 格練習</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs text-stone-500 mb-1">描紅格子數 (淡灰)</label>
            <select id="traceCountSelect" class="w-full px-2.5 py-1.5 rounded-xl border border-stone-300 text-xs font-medium bg-white outline-none focus:border-emerald-600">
              <option value="0">0 格 (全空白練習)</option>
              <option value="1">前 1 格描紅</option>
              <option value="2" selected>前 2 格描紅</option>
              <option value="3">前 3 格描紅</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-stone-500 mb-1">最左側訂正欄</label>
            <select id="showCorrectionSelect" class="w-full px-2.5 py-1.5 rounded-xl border border-stone-300 text-xs font-medium bg-white outline-none focus:border-emerald-600">
              <option value="yes" selected>顯示「訂正」直欄</option>
              <option value="no">不顯示訂正欄</option>
            </select>
          </div>
        </div>
      </div>

      <hr class="border-stone-100">

      <!-- 2. 出題模式切換（部首/筆畫/筆順顯示控制） -->
      <div class="space-y-2">
        <label class="text-sm font-bold text-stone-800 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
          考卷／學習單欄位顯示模式
        </label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="modeAnswerBtn" onclick="setFillMode('answer')" class="py-2 px-2.5 rounded-xl border-2 border-emerald-600 bg-emerald-50 text-emerald-900 text-xs font-bold text-center cursor-pointer transition">
            學習單模式 (顯示部首筆畫)
          </button>
          <button type="button" id="modeQuizBtn" onclick="setFillMode('quiz')" class="py-2 px-2.5 rounded-xl border border-stone-200 bg-white text-stone-600 text-xs font-bold text-center cursor-pointer transition">
            測驗卷模式 (部首筆畫留白)
          </button>
        </div>
        <div class="flex items-center justify-between pt-1 text-xs text-stone-600">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="showStrokeOrderChk" checked class="rounded text-emerald-600 w-3.5 h-3.5">
            <span>顯示分解筆順步驟</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="showZhuyinChk" checked class="rounded text-emerald-600 w-3.5 h-3.5">
            <span>顯示注音符號</span>
          </label>
        </div>
      </div>

      <hr class="border-stone-100">

      <!-- 3. 生字清單與明細微調表 -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between">
          <label class="text-sm font-bold text-stone-800 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
            生字明細編輯 (<span id="totalCharCount">11</span> 字)
          </label>
          <div class="flex items-center gap-1.5">
            <button type="button" onclick="openImportModal()" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-lg border border-emerald-200 cursor-pointer transition">
              + 匯入文字
            </button>
            <button type="button" onclick="addEmptyCharRow()" class="text-xs bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold px-2 py-1 rounded-lg cursor-pointer transition">
              + 單字
            </button>
          </div>
        </div>

        <p class="text-[11px] text-stone-500">可直接點擊下方表格微調注音、部首與筆畫數，系統會即時更新右側 A4 預覽：</p>

        <div class="border border-stone-200 rounded-xl overflow-hidden">
          <div class="max-h-[300px] overflow-y-auto">
            <table class="w-full text-xs text-left border-collapse">
              <thead class="bg-stone-100 text-stone-600 sticky top-0 z-10 border-b border-stone-200">
                <tr>
                  <th class="py-2 px-2 text-center w-11">生字</th>
                  <th class="py-2 px-1.5 w-20">注音</th>
                  <th class="py-2 px-1 text-center w-11">部首</th>
                  <th class="py-2 px-1 text-center w-11" title="部首筆畫">部畫</th>
                  <th class="py-2 px-1 text-center w-11" title="部首外筆畫">外畫</th>
                  <th class="py-2 px-1 text-center w-11" title="總筆畫">總畫</th>
                  <th class="py-2 px-1 text-center w-8">刪</th>
                </tr>
              </thead>
              <tbody id="charEditorTbody" class="divide-y divide-stone-100 bg-white">
                <!-- 由 JS 動態生成 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </aside>

    <!-- 右側 A4 橫式即時預覽區 -->
    <main class="flex-1 w-full flex flex-col items-center overflow-hidden">
      <div class="no-print w-full flex flex-wrap items-center justify-between gap-2 mb-3 px-1">
        <div class="text-xs text-stone-600 flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span>A4 橫式預覽（297mm × 210mm・由右至左書寫）</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="exportToPNG()" class="text-xs bg-white hover:bg-stone-50 text-stone-700 font-medium px-3 py-1.5 rounded-lg border border-stone-300 shadow-2xs cursor-pointer transition">
            下載練習卷圖片 (PNG)
          </button>
          <span class="text-xs text-stone-500" id="zoomStatusText">100% 檢視</span>
        </div>
      </div>

      <div id="previewScrollContainer" class="preview-area w-full overflow-x-auto pb-6 flex flex-col items-center">
        <div id="pagesContainer" class="flex flex-col items-center">
          <!-- A4 橫式頁面動態生成區 -->
        </div>
      </div>
    </main>

  </div>

  <!-- ==========================================
       彈窗 1：匯入文字 / 課文 / CSV 視窗
       ========================================== -->
  <div id="importModal" class="no-print fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden border border-stone-200 animate-fade-in">
      <div class="bg-emerald-800 text-white px-5 py-3.5 flex items-center justify-between">
        <h3 class="font-bold text-base flex items-center gap-2">
          <span>📥</span> 匯入文字 / 課文 / 生字表
        </h3>
        <button onclick="closeImportModal()" class="text-emerald-200 hover:text-white text-xl leading-none cursor-pointer">&times;</button>
      </div>

      <div class="p-5 space-y-4">
        <!-- 檔案上傳區 -->
        <div class="border-2 border-dashed border-emerald-300 bg-emerald-50/50 rounded-xl p-4 text-center">
          <input type="file" id="textFileInput" accept=".txt,.csv,.tsv" class="hidden" onchange="handleFileUpload(event)">
          <label for="textFileInput" class="cursor-pointer flex flex-col items-center gap-1.5">
            <span class="text-2xl">📄</span>
            <span class="text-sm font-bold text-emerald-900">點擊上傳 .txt 或 .csv 文字檔案</span>
            <span class="text-xs text-stone-500">支援純文字課文段落，或「字,注音,部首,部首筆畫,總筆畫」CSV 格式</span>
          </label>
        </div>

        <!-- 文字貼上區 -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-stone-700">或直接貼上課文段落／生字清單：</label>
            <button type="button" onclick="fillImportSample()" class="text-xs text-emerald-700 hover:underline cursor-pointer">
              填入範例課文
            </button>
          </div>
          <textarea id="importTextarea" rows="5"

  <script>
    /* ==========================================

      '右': { z: 'ㄧㄡˋ', r: '口', rs: 3, os: 2, ts: 5 },
      '手': { z: 'ㄕㄡˇ', r: '手', rs: 4, os: 0, ts: 4 },
      '足': { z: 'ㄗㄨˊ', r: '足', rs: 7, os: 0, ts: 7 },
      '耳': { z: 'ㄦˇ', r: '耳', rs: 6, os: 0, ts: 6 },
      '目': { z: 'ㄇㄨˋ', r: '目', rs: 5, os: 0, ts: 5 },
      '口': { z: 'ㄎㄡˇ', r: '口', rs: 3, os: 0, ts: 3 },
      '心': { z: 'ㄒㄧㄣ', r: '心', rs: 4, os: 0, ts: 4 },
      '木': { z: 'ㄇㄨˋ', r: '木', rs: 4, os: 0, ts: 4 },
      '林': { z: 'ㄌㄧㄣˊ', r: '木', rs: 4, os: 4, ts: 8 },
      '森': { z: 'ㄙㄣ', r: '木', rs: 4, os: 8, ts: 12 },
      '鳥': { z: 'ㄋㄧㄠˇ', r: '鳥', rs: 11, os: 0, ts: 11 },
      '魚': { z: 'ㄩˊ', r: '魚', rs: 11, os: 0, ts: 11 },
      '蟲': { z: 'ㄔㄨㄥˊ', r: '虫', rs: 6, os: 12, ts: 18 },
      '草': { z: 'ㄘㄠˇ', r: '艸', rs: 4, os: 6, ts: 10 }
    };

    // 筆順 SVG 快取池
    const strokeDataCache = {};

    /* ==========================================
       應用程式狀態 (State)
       ========================================== */
    const state = {
      title: '國語生字練習卷《小時不識月》',
      colsPerPage: 8,
      practiceRows: 4,
      traceCount: 2,
      showCorrection: true,
      fillMode: 'answer', // 'answer' | 'quiz'
      showStrokeOrder: true,
      showZhuyin: true,
      items: [
        { char: '小', zhuyin: 'ㄒㄧㄠˇ', radical: '小', radStrokes: 3, outStrokes: 0, totStrokes: 3 },
        { char: '時', zhuyin: 'ㄕˊ', radical: '日', radStrokes: 4, outStrokes: 6, totStrokes: 10 },
        { char: '不', zhuyin: 'ㄅㄨˋ', radical: '一', radStrokes: 1, outStrokes: 3, totStrokes: 4 },
        { char: '識', zhuyin: 'ㄕˋ', radical: '言', radStrokes: 7, outStrokes: 12, totStrokes: 19 },
        { char: '月', zhuyin: 'ㄩㄝˋ', radical: '月', radStrokes: 4, outStrokes: 0, totStrokes: 4 },
        { char: '呼', zhuyin: 'ㄏㄨ', radical: '口', radStrokes: 3, outStrokes: 5, totStrokes: 8 },
        { char: '作', zhuyin: 'ㄗㄨㄛˋ', radical: '人', radStrokes: 2, outStrokes: 5, totStrokes: 7 },
        { char: '白', zhuyin: 'ㄅㄞˊ', radical: '白', radStrokes: 5, outStrokes: 0, totStrokes: 5 },
        { char: '玉', zhuyin: 'ㄩˋ', radical: '玉', radStrokes: 5, outStrokes: 0, totStrokes: 5 },
        { char: '盤', zhuyin: 'ㄆㄢˊ', radical: '皿', radStrokes: 5, outStrokes: 10, totStrokes: 15 }
      ]
    };

    /* ==========================================
       線上自動查詢國字資料 (萌典 API + HanziWriter 筆順)
       ========================================== */
    async function fetchCharMetadata(ch) {
      // 1. 先檢查內建字典
      if (BUILTIN_CHAR_DB[ch]) {
        const d = BUILTIN_CHAR_DB[ch];
        return {
          char: ch,
          zhuyin: d.z,
          radical: d.r,
          radStrokes: d.rs,
          outStrokes: d.os,
          totStrokes: d.ts
        };
      }

      // 2. 嘗試透過萌典公開 API 查詢注音、部首與筆畫
      try {
        const res = await fetch(`https://www.moedict.tw/uni/${encodeURIComponent(ch)}`);
        if (res.ok) {
          const data = await res.json();
          const zhuyin = (data.h && data.h[0] && data.h[0].b) ? data.h[0].b.split('（')[0].trim() : '';
          const radical = data.r || '';
          const totStrokes = data.c || '';
          const nonRadStrokes = data.n !== undefined ? data.n : '';
          const radStrokes = (totStrokes && nonRadStrokes !== '') ? Math.max(1, totStrokes - nonRadStrokes) : '';

          return {
            char: ch,
            zhuyin: zhuyin,
            radical: radical,
            radStrokes: radStrokes,
            outStrokes: nonRadStrokes,
            totStrokes: totStrokes
          };
        }
      } catch (err) {
        // 離線或 CORS 限制時靜默降級
      }

      return {
        char: ch,
        zhuyin: '',
        radical: '',
        radStrokes: '',
        outStrokes: '',
        totStrokes: ''
      };
    }

    // 載入並快取單字筆順路徑 (HanziWriter)
    async function loadStrokeData(ch) {
      if (!ch || strokeDataCache[ch] !== undefined) return strokeDataCache[ch];
      if (typeof HanziWriter === 'undefined') return null;

      try {
        const charData = await HanziWriter.loadCharacterData(ch);
        strokeDataCache[ch] = charData || null;
        return strokeDataCache[ch];
      } catch (e) {
        strokeDataCache[ch] = null;
        return null;
      }
    }

    async function preloadAllStrokes() {
      const uniqueChars = [...new Set(state.items.map(i => i.char).filter(Boolean))];
      await Promise.all(uniqueChars.map(ch => loadStrokeData(ch)));
      renderWorksheet();
    }

    /* ==========================================
       HTML 元件生成輔助函式
       ========================================== */
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // 田字格虛線 SVG
    function renderTianGridSVG() {
      return `
        <svg class="tian-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="50" y1="0" x2="50" y2="100" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="3,3" />
          <line x1="0" y1="50" x2="100" y2="50" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="3,3" />
        </svg>
      `;
    }

    // 台灣標準右側直式注音 HTML
    function renderZhuyinHTML(rawZhuyin, fontSizePx) {
      if (!state.showZhuyin || !rawZhuyin) return '';
      const trimmed = rawZhuyin.trim();
      if (!trimmed) return '';

      let neutralTone = '';
      let toneMark = '';
      let body = trimmed;

      if (body.startsWith('˙')) {
        neutralTone = '˙';
        body = body.slice(1);
      } else if (body.endsWith('˙')) {
        neutralTone = '˙';
        body = body.slice(0, -1);
      }

      const lastChar = body.slice(-1);
      if (['ˊ', 'ˇ', 'ˋ'].includes(lastChar)) {
        toneMark = lastChar;
        body = body.slice(0, -1);
      }

      const symbols = body.split('');
      const symbolSize = Math.max(7, Math.round(fontSizePx * 0.25));

      return `
        <div class="zhuyin-inner zhuyin-font" style="font-size: ${symbolSize}px; color: #0f172a;">
          <div class="zhuyin-symbols">
            ${neutralTone ? `<span class="zhuyin-neutral">${neutralTone}</span>` : ''}
            ${symbols.map(s => `<span>${s}</span>`).join('')}
          </div>
          ${toneMark ? `<span class="zhuyin-tone">${toneMark}</span>` : ''}
        </div>
      `;
    }

    // 分解筆順步驟 SVG 渲染
    function renderStrokeOrderHTML(ch, boxWidthMm, boxHeightMm) {
      if (!state.showStrokeOrder || !ch) return '';
      const data = strokeDataCache[ch];

      if (!data || !data.strokes || data.strokes.length === 0) {
        return `<span class="text-[9px] text-stone-400">筆順共 ${state.items.find(x => x.char === ch)?.totStrokes || '?'} 畫</span>`;
      }

      const strokes = data.strokes;
      // 計算每個小方格尺寸，確保最多能放得下所有筆畫（若超過16畫則取關鍵步驟或縮小方格）
      const total = strokes.length;
      const stepSizePx = total <= 8 ? 22 : (total <= 14 ? 17 : 14);

      const stepsHTML = strokes.map((_, stepIdx) => {
        const paths = strokes.slice(0, stepIdx + 1).map((d, idx) => {
          const isCurrent = idx === stepIdx;
          return `<path d="${d}" fill="${isCurrent ? '#dc2626' : '#334155'}" />`;
        }).join('');

        return `
          <div class="stroke-step-item" style="width: ${stepSizePx}px; height: ${stepSizePx}px;">
            <svg viewBox="0 0 1024 1024" style="width: 88%; height: 88%;">
              <g transform="scale(1, -1) translate(0, -900)">
                ${paths}
              </g>
            </svg>
          </div>
        `;
      }).join('');

      return `<div class="stroke-order-box">${stepsHTML}</div>`;
    }

    /* ==========================================
       核心 A4 橫式練習卷渲染引擎
       ========================================== */
    function renderWorksheet() {
      const container = document.getElementById('pagesContainer');
      const colsPerPage = state.colsPerPage;
      const items = state.items.length > 0 ? state.items : [{ char: '', zhuyin: '', radical: '', radStrokes: '', outStrokes: '', totStrokes: '' }];

      // 依每頁生字欄數進行分頁
      const pages = [];
      for (let i = 0; i < items.length; i += colsPerPage) {
        const slice = items.slice(i, i + colsPerPage);
        // 若不足每頁欄數，補齊空白欄維持完整表格結構
        while (slice.length < colsPerPage) {
          slice.push({ char: '', zhuyin: '', radical: '', radStrokes: '', outStrokes: '', totStrokes: '' });
        }
        pages.push(slice);
      }

      document.getElementById('pageBadge').textContent = `共 ${pages.length} 頁 A4 橫式`;
      document.getElementById('totalCharCount').textContent = state.items.length;

      // 計算各列高度 (A4橫式高度 210mm, 上下padding各8mm = 194mm; 頁首約13mm, 頁尾約6mm -> 表格總高約 173mm)
      const tableHeightMm = 173;
      const topCharRowMm = 23;     // 1. 生字大格
      const radicalRowMm = 14;     // 2. 部首和部首筆畫
      const strokesRowMm = 13;     // 3. 部首外筆畫 / 總筆畫
      const orderRowMm = 24;       // 4. 筆順步驟區
      const practiceTotalMm = tableHeightMm - (topCharRowMm + radicalRowMm + strokesRowMm + orderRowMm);
      const singlePracticeMm = practiceTotalMm / state.practiceRows;

      // 計算欄寬 (A4橫式寬度 297mm, 左右padding各10mm = 277mm)
      const totalWidthMm = 277;
      const headerColWidthMm = 22; // 最右側標題欄
      const correctionColWidthMm = state.showCorrection ? 16 : 0; // 最左側訂正欄
      const remainingWidthMm = totalWidthMm - headerColWidthMm - correctionColWidthMm;
      const charColWidthMm = remainingWidthMm / colsPerPage;
      const zhuyinStripMm = Math.min(7.5, charColWidthMm * 0.28);

      const topGlyphPx = Math.round((topCharRowMm - 2) * 3.7795 * 0.8);
      const practiceGlyphPx = Math.round((singlePracticeMm - 1.5) * 3.7795 * 0.8);

      const isAnswerMode = state.fillMode === 'answer';

      const pagesHTML = pages.map((pageItems, pageIdx) => {
        // 1. 最右側：標題欄
        const rightHeaderColHTML = `
          <div class="ws-column ws-header-col" style="width: ${headerColWidthMm}mm; font-size: 9.5pt; line-height: 1.25;">
            <div class="ws-cell" style="height: ${topCharRowMm}mm;">生字</div>
            <div class="ws-cell" style="height: ${radicalRowMm}mm; padding: 0 2px;">部首和<br>部首筆畫</div>
            <div class="ws-cell" style="height: ${strokesRowMm}mm; padding: 0 2px;">部首外筆畫<br>／總筆畫</div>
            <div class="ws-cell" style="height: ${orderRowMm}mm;">筆順</div>
            <div class="ws-cell" style="height: ${practiceTotalMm}mm;">生字<br>練習</div>
          </div>
        `;

        // 2. 中間各欄：每個生字一欄（由右至左排列）
        const charColsHTML = pageItems.map((item) => {
          const hasChar = Boolean(item.char);

          // 練習格生成 (共 state.practiceRows 格)
          let practiceCellsHTML = '';
          for (let r = 0; r < state.practiceRows; r++) {
            const isTrace = hasChar && r < state.traceCount;
            practiceCellsHTML += `
              <div class="ws-cell" style="height: ${singlePracticeMm}mm; align-items: stretch;">
                <div style="flex: 1; position: relative; display: flex; align-items: center; justify-content: center;">
                  ${renderTianGridSVG()}
                  ${isTrace ? `<span class="char-glyph font-kai glyph-trace" style="font-size: ${practiceGlyphPx}px;">${escapeHTML(item.char)}</span>` : ''}
                </div>
                <div class="zhuyin-strip" style="width: ${zhuyinStripMm}mm; opacity: 0.45;">
                  ${isTrace ? renderZhuyinHTML(item.zhuyin, practiceGlyphPx) : ''}
                </div>
              </div>
            `;
          }

          return `
            <div class="ws-column" style="width: ${charColWidthMm}mm;">
              <!-- 第1列：生字大田字格 + 右側注音框 -->
              <div class="ws-cell" style="height: ${topCharRowMm}mm; align-items: stretch;">
                <div style="flex: 1; position: relative; display: flex; align-items: center; justify-content: center;">
                  ${renderTianGridSVG()}
                  ${hasChar ? `<span class="char-glyph font-kai glyph-demo" style="font-size: ${topGlyphPx}px;">${escapeHTML(item.char)}</span>` : ''}
                </div>
                <div class="zhuyin-strip" style="width: ${zhuyinStripMm}mm;">
                  ${hasChar ? renderZhuyinHTML(item.zhuyin, topGlyphPx) : ''}
                </div>
              </div>

              <!-- 第2列：部首（上）和部首筆畫（下） -->
              <div class="ws-cell" style="height: ${radicalRowMm}mm; flex-direction: column;">
                <div style="height: 54%; width: 100%; border-bottom: 1px dashed #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 10.5pt; font-weight: 700;" class="font-kai">
                  ${(hasChar && isAnswerMode) ? escapeHTML(item.radical) : ''}
                </div>
                <div style="height: 46%; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 9pt; color: #334155;">
                  ${(hasChar && isAnswerMode && item.radStrokes !== '') ? `${escapeHTML(item.radStrokes)}` : ''}
                </div>
              </div>

              <!-- 第3列：部首外筆畫（左） ／ 總筆畫（右） -->
              <div class="ws-cell" style="height: ${strokesRowMm}mm; flex-direction: row;">
                <div style="width: 50%; height: 100%; border-right: 1px dashed #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 9.5pt;">
                  ${(hasChar && isAnswerMode && item.outStrokes !== '') ? escapeHTML(item.outStrokes) : ''}
                </div>
                <div style="width: 50%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 9.5pt; font-weight: 600;">
                  ${(hasChar && isAnswerMode && item.totStrokes !== '') ? escapeHTML(item.totStrokes) : ''}
                </div>
              </div>

              <!-- 第4列：筆順步驟圖示 -->
              <div class="ws-cell" style="height: ${orderRowMm}mm;">
                ${hasChar ? renderStrokeOrderHTML(item.char, charColWidthMm, orderRowMm) : ''}
              </div>

              <!-- 第5列：下方生字練習田字格 -->
              ${practiceCellsHTML}
            </div>
          `;
        }).join('');

        // 3. 最左側：訂正欄
        const leftCorrectionColHTML = state.showCorrection ? `
          <div class="ws-column" style="width: ${correctionColWidthMm}mm;">
            <div class="ws-cell ws-header-col" style="height: ${topCharRowMm}mm; font-size: 10pt;">訂正</div>
            <div class="ws-cell" style="flex: 1; background: #ffffff;"></div>
          </div>
        ` : '';

        return `
          <div class="a4-landscape-page">
            <!-- 頁首標題與學生資訊列 -->
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5mm; padding-bottom: 1.5mm;">
              <h2 class="font-kai" style="font-size: 17.5pt; font-weight: 700; margin: 0; letter-spacing: 1px; color: #0f172a;">
                ${escapeHTML(state.title)}
              </h2>
              <div style="font-size: 10.5pt; display: flex; gap: 12px; align-items: center; color: #1e293b;">
                <span>班級：<span style="display:inline-block; width: 14mm; border-bottom: 1px solid #334155;"></span></span>
                <span>座號：<span style="display:inline-block; width: 11mm; border-bottom: 1px solid #334155;"></span></span>
                <span>姓名：<span style="display:inline-block; width: 24mm; border-bottom: 1px solid #334155;"></span></span>
                <span>得分：<span style="display:inline-block; width: 14mm; border-bottom: 1px solid #334155;"></span></span>
              </div>
            </div>

            <!-- 主表格（由右至左：標題欄 -> 第1~N字 -> 訂正欄） -->
            <div class="worksheet-table">
              ${rightHeaderColHTML}
              ${charColsHTML}
              ${leftCorrectionColHTML}
            </div>

            <!-- 頁尾資訊 -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2mm; font-size: 8.5pt; color: #475569;">
              <span>A4橫式國小生字練習卷(由右至左書寫)</span>
              <span>第 ${pageIdx + 1} 頁 / 共 ${pages.length} 頁</span>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = pagesHTML;
      adjustPreviewScale();
    }

    // 視窗寬度不足時自動縮放預覽比例
    function adjustPreviewScale() {
      const scrollBox = document.getElementById('previewScrollContainer');
      const pages = document.querySelectorAll('.a4-landscape-page');
      if (!scrollBox || !pages.length) return;

      const availablePx = scrollBox.clientWidth - 24;
      const a4LandscapePx = 1122.5; // 297mm in px at 96dpi
      const scale = Math.min(1, availablePx / a4LandscapePx);

      document.getElementById('zoomStatusText').textContent = `${Math.round(scale * 100)}% 預覽`;

      pages.forEach(page => {
        if (scale < 1) {
          page.style.transform = `scale(${scale})`;
          page.style.transformOrigin = 'top left';
          const heightDiff = 793.7 * (scale - 1);
          page.style.marginBottom = `${heightDiff + 16}px`;
        } else {
          page.style.transform = '';
          page.style.marginBottom = '24px';
        }
      });
    }

              oninput="updateItemField(${idx}, 'radStrokes', this.value)"

          </td>
          <td class="p-1.5 text-center">
            <input type="number" min="0" max="40" value="${escapeHTML(item.outStrokes)}"
              oninput="updateItemField(${idx}, 'outStrokes', this.value)"
              class="w-10 py-1 text-center text-xs border border-stone-200 rounded-lg focus:border-emerald-600 outline-none">
          </td>
          <td class="p-1.5 text-center">
            <input type="number" min="1" max="50" value="${escapeHTML(item.totStrokes)}"
              oninput="updateItemField(${idx}, 'totStrokes', this.value)"
              class="w-10 py-1 text-center text-xs font-bold border border-stone-200 rounded-lg focus:border-emerald-600 outline-none">

    async function updateItemField(idx, field, val) {
      if (!state.items[idx]) return;
      state.items[idx][field] = val;

      // 若更改了國字，自動查詢新字的注音、部首、筆畫與筆順
      if (field === 'char' && val.trim()) {
        const ch = val.trim()[0];
        const meta = await fetchCharMetadata(ch);
        state.items[idx] = meta;
        await loadStrokeData(ch);
        renderCharEditorTable();
      }
      renderWorksheet();
    }

    function addEmptyCharRow() {
      state.items.push({ char: '', zhuyin: '', radical: '', radStrokes: '', outStrokes: '', totStrokes: '' });
      renderCharEditorTable();
      renderWorksheet();
    }

    function removeCharRow(idx) {
      state.items.splice(idx, 1);
      renderCharEditorTable();
      renderWorksheet();
    }

    async function processImportedText() {
      const raw = document.getElementById('importTextarea').value;
      if (!raw.trim()) {
        showToast('請先輸入或上傳要匯入的文字', '⚠️');
        return;
      }

      const btn = document.getElementById('btnConfirmImport');
      btn.disabled = true;
      btn.innerHTML = '<span>正在查詢部首與筆順...</span>';

      const dedupe = document.getElementById('dedupeCharsChk').checked;
      const mode = document.querySelector('input[name="importMode"]:checked').value;

      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const isCSVFormat = lines.length > 0 && lines.every(l => l.includes(',') || l.includes('\t'));

      let parsedList = [];

      if (isCSVFormat) {
        // 進階 CSV / TSV 格式：字,注音,部首,部首筆畫,總筆畫
        for (const line of lines) {
          const parts = line.split(/[,\t]/).map(s => s.trim());
          const chMatch = (parts[0] || '').match(/[\u4E00-\u9FFF\u3400-\u4DBF]/);
          if (!chMatch) continue;
          const ch = chMatch[0];
          const base = await fetchCharMetadata(ch);
          const radStrokes = parts[3] ? Number(parts[3]) : base.radStrokes;
          const totStrokes = parts[4] ? Number(parts[4]) : base.totStrokes;
          const outStrokes = (totStrokes !== '' && radStrokes !== '') ? Math.max(0, totStrokes - radStrokes) : base.outStrokes;

          parsedList.push({
            char: ch,
            zhuyin: parts[1] || base.zhuyin,
            radical: parts[2] || base.radical,
            radStrokes,
            outStrokes,
            totStrokes
          });
        }
      } else {
        // 一般課文或生字字串：萃取所有中文字
        const matches = raw.match(/[\u4E00-\u9FFF\u3400-\u4DBF]/g) || [];
        const charsToProcess = dedupe ? [...new Set(matches)] : matches;

        for (const ch of charsToProcess) {
          const meta = await fetchCharMetadata(ch);
          parsedList.push(meta);
        }
      }

      if (mode === 'append') {
        const existingSet = new Set(state.items.map(i => i.char));
        const filtered = dedupe ? parsedList.filter(i => !existingSet.has(i.char)) : parsedList;
        state.items = [...state.items, ...filtered];
      } else {
        state.items = parsedList;
      }

      await preloadAllStrokes();
      renderCharEditorTable();
      renderWorksheet();

      btn.disabled = false;
      btn.innerHTML = '<span>匯入並自動查詢部首筆順</span>';
      closeImportModal();
      showToast(`成功匯入 ${parsedList.length} 個生字！`, '✅');
    }

    /* ==========================================
       匯出 PDF / PNG 與 LINE 一鍵分享模組
       ========================================== */
    async function generatePagesCanvases() {
      const pages = document.querySelectorAll('.a4-landscape-page');
      const canvases = [];

      for (const page of pages) {
        // 暫時清除行動裝置縮放以確保 100% 高解析度截圖
        const prevTransform = page.style.transform;
        const prevMargin = page.style.marginBottom;
        page.style.transform = 'none';
        page.style.marginBottom = '0';

        const canvas = await html2canvas(page, {
          scale: 2.2,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false
        });

        page.style.transform = prevTransform;
        page.style.marginBottom = prevMargin;
        canvases.push(canvas);
      }
      return canvases;
    }

    async function buildPDFBlob() {
      const { jsPDF } = window.jspdf;
      const canvases = await generatePagesCanvases();
      const pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'mm',
        format: 'a4'
      });

      canvases.forEach((canvas, idx) => {
        if (idx > 0) pdf.addPage('a4', 'landscape');
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
      });

      return pdf;
    }

    async function exportToPDF() {
      showToast('正在產生 A4 橫式高解析 PDF，請稍候...', '⏳');
      try {
        const pdf = await buildPDFBlob();
        const fileName = `${state.title || '國小生字練習卷'}.pdf`;
        pdf.save(fileName);
        showToast(`已下載「${fileName}」`, '📄');
      } catch (err) {
        showToast('PDF 匯出失敗，請改用「列印 -> 另存為 PDF」', '⚠️');
      }
    }

    async function exportToPNG() {
      showToast('正在轉換練習卷為高畫質圖片...', '⏳');
      try {
        const canvases = await generatePagesCanvases();
        canvases.forEach((canvas, idx) => {
          const link = document.createElement('a');
          link.download = `${state.title || '國小生字練習卷'}_第${idx + 1}頁.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
        showToast(`已下載 ${canvases.length} 張練習卷圖片！`, '🖼️');
      } catch (err) {
        showToast('圖片匯出發生錯誤', '⚠️');
      }
    }

      const shareText = `【${state.title}】\n本次練習生字（共 ${state.items.length} 字）：\n${charListStr}\n\n已產生 A4 橫式國小生字練習卷（含注音、部首、筆畫與筆順），歡迎列印練習！`;

    function copyShareText() {
      const textarea = document.getElementById('lineShareTextPreview');
      textarea.select();

    function shareTextDirectlyToLine() {
      const text = document.getElementById('lineShareTextPreview').value;

    async function shareFileToLine(fileType) {
      showToast(`正在準備 ${fileType.toUpperCase()} 檔案以分享至 LINE...`, '⏳');
      try {
        let fileObj = null;
        const baseName = state.title || '國小生字練習卷';

        if (fileType === 'pdf') {
          const pdf = await buildPDFBlob();
          const blob = pdf.output('blob');
          fileObj = new File([blob], `${baseName}.pdf`, { type: 'application/pdf' });
        } else {
          const canvases = await generatePagesCanvases();
          const blob = await new Promise(resolve => canvases[0].toBlob(resolve, 'image/png'));
          fileObj = new File([blob], `${baseName}_第1頁.png`, { type: 'image/png' });
        }

        // 若裝置支援原生檔案分享（手機 / 平板可直接選取 LINE 傳送檔案）
        if (navigator.canShare && navigator.canShare({ files: [fileObj] })) {
          await navigator.share({
            title: baseName,
            text: `分享《${baseName}》A4 橫式生字練習卷`,
            files: [fileObj]
          });
          showToast('已開啟系統分享選單！', '✅');
        } else {
          // 桌面瀏覽器：自動下載檔案並引導開啟 LINE 傳送
          const url = URL.createObjectURL(fileObj);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileObj.name;
          a.click();
          URL.revokeObjectURL(url);

          showToast(`檔案「${fileObj.name}」已下載！正在為您開啟 LINE...`, '📥');
          setTimeout(() => {
            shareTextDirectlyToLine();
          }, 900);
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          showToast('分享過程發生中斷，您可直接下載 PDF 後傳送至 LINE', 'ℹ️');
        }
      }
    }

    }

    function handlePrint() {
      document.querySelectorAll('.a4-landscape-page').forEach(p => {
        p.style.transform = 'none';
        p.style.marginBottom = '0';
      });
      showToast('正在開啟 A4 橫式列印視窗，請確認方向為「橫向」並勾選「背景圖形」', '🖨️');
      setTimeout(() => {
        window.print();
        adjustPreviewScale();
      }, 250);
    }

    function showToast(msg, icon = '✅') {
      const box = document.getElementById('toastBox');
      document.getElementById('toastIcon').textContent = icon;
      document.getElementById('toastMsg').textContent = msg;
      box.classList.remove('opacity-0');
      setTimeout(() => {
        box.classList.add('opacity-0');
      }, 3200);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('sheetTitleInput').addEventListener('input', (e) => {
        state.title = e.target.value;
        renderWorksheet();
      });

      document.getElementById('colsPerPageSelect').addEventListener('change', (e) => {
        state.colsPerPage = parseInt(e.target.value, 10);
        renderWorksheet();
      });

      document.getElementById('practiceRowsSelect').addEventListener('change', (e) => {
        state.practiceRows = parseInt(e.target.value, 10);
        renderWorksheet();
      });

      document.getElementById('traceCountSelect').addEventListener('change', (e) => {
        state.traceCount = parseInt(e.target.value, 10);
        renderWorksheet();
      });

      document.getElementById('showCorrectionSelect').addEventListener('change', (e) => {
        state.showCorrection = e.target.value === 'yes';
        renderWorksheet();
      });

      document.getElementById('showStrokeOrderChk').addEventListener('change', (e) => {
        state.showStrokeOrder = e.target.checked;
        renderWorksheet();
      });

      document.getElementById('showZhuyinChk').addEventListener('change', (e) => {
        state.showZhuyin = e.target.checked;
        renderWorksheet();
      });

      window.addEventListener('resize', adjustPreviewScale);

      renderCharEditorTable();
      renderWorksheet();
      await preloadAllStrokes();
    });
  </script>
</body>
</html>
